[project]
name = "vest-technical-interview"
version = "0.1.0"
description = "Portfolio Data Clearinghouse - trade/position reconciliation system"
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
